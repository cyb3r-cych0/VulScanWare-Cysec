  "bs4==0.0.2",
  "certifi==2026.1.4",
  "cffi==2.0.0",
  "charset-normalizer==3.4.4",
  "click==8.3.1",
  "colorama==0.4.6",
  "coverage==7.13.1",
  "cssselect2==0.8.0",
  "diskcache==5.6.3",
  "distro==1.9.0",
  "fastapi==0.128.0",
  "fonttools==4.61.1",
  "greenlet==3.3.0",
  "h11==0.16.0",
  "httpcore==1.0.9",
  "httpx==0.28.1",
  "idna==3.11",
  "iniconfig==2.3.0",
