[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "VulScanWare"
version = "0.1.0"
description = "AI-enhanced XSS vulnerability scanner"
requires-python = ">=3.14"

dependencies = [
  "requests",
  "beautifulsoup4",
  "rich",
  "typer",
  "fastapi",
  "uvicorn",
  "jinja2",
    "annotated-doc==0.0.4",
  "annotated-types==0.7.0",
  "anyio==4.12.1",
  "beautifulsoup4==4.14.3",
